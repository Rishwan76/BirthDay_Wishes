services:
  - type: web
    name: birthday-memories
    runtime: node
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_REGISTRATION_KEY
        sync: false
      - key: NODE_VERSION
        value: 20
